<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1350">
    <title>{{ headline }}</title>
    <style>
        {{ css }}
        /* Technology Variant Overrides */
        .category-tech { background: #f3e5f5; color: #6a1b9a; }
        .container.variant-tech .decor-top,
        .container.variant-tech .decor-bottom {
            background: linear-gradient(90deg, var(--accent-purple), var(--brand-color));
        }
        .key-point { border-left-color: var(--accent-purple); }
        .bullet { color: var(--accent-purple); }
</head>
<body style="background-image: url('{{ background_image }}'); background-size: cover; background-position: center; background-repeat: no-repeat;">
    <div class="container variant-tech" data-ready="true">
        <!-- Brand Header -->
        <header class="brand-header">
            <div class="brand-logo">
                <img src="data:image/png;base64,{{ logo_base64 }}" alt="{{ brand_name }}" class="logo-img">
                <span class="brand-name">{{ brand_name }}</span>
            </div>
            <span class="brand-handle">{{ brand_handle }}</span>
        </header>

        <!-- Category Badge -->
        <div class="category-badge category-tech">
            TEKNOLOGI
        </div>

        <!-- Main Headline -->
        <main class="content">
            <h1 class="headline">{{ headline }}</h1>

            <!-- Key Points -->
            <ul class="key-points">
                {% for point in key_points %}
                <li class="key-point">
                    <span class="bullet">•</span>
                    <span class="point-text">{{ point }}</span>
                </li>
                {% endfor %}
            </ul>

            <!-- Source Attribution -->
            <footer class="source-footer">
                <span class="source-label">{{ source_attribution }}</span>
                <span class="timestamp">{{ timestamp }}</span>
            </footer>
        </main>

        <!-- Decorative Elements -->
        <div class="decor-top"></div>
        <div class="decor-bottom"></div>
        
        <!-- Watermark -->
        <div class="watermark">{{ watermark_text }}</div>
    </div>
</body>
</html>

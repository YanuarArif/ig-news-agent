<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1350">
    <title>{{ headline }}</title>
    <style>
        {{ css }}
        /* Breaking News Variant Overrides */
        .container {
            background: linear-gradient(180deg, #fff8f8 0%, #ffffff 100%);
        }
        .headline {
            color: #c62828;
            text-shadow: 0 2px 8px rgba(198,40,40,0.15);
        }
        .key-point {
            border-left-color: #e53935;
            background: #fff8f8;
        }
        .bullet { color: #e53935; }
        .category-breaking_news { background: #ffcdd2; color: #b71c1c; }
    </style>
</head>
<body>
    <div class="container variant-breaking_news" data-ready="true">
        <header class="brand-header">
            <div class="brand-logo">
                <img src="data:image/png;base64,{{ logo_base64 }}" alt="{{ brand_name }}" class="logo-img">
                <span class="brand-name">{{ brand_name }}</span>
            </div>
            <span class="brand-handle">{{ brand_handle }}</span>
        </header>

        <div class="category-badge category-breaking_news">
            BREAKING NEWS
        </div>

        <main class="content">
            <h1 class="headline">{{ headline }}</h1>

            <ul class="key-points">
                {% for point in key_points %}
                <li class="key-point">
                    <span class="bullet">•</span>
                    <span class="point-text">{{ point }}</span>
                </li>
                {% endfor %}
            </ul>

            <footer class="source-footer">
                <span class="source-label">{{ source_attribution }}</span>
                <span class="timestamp">{{ timestamp }}</span>
            </footer>
        </main>

        <div class="decor-top"></div>
        <div class="decor-bottom"></div>
    </div>
</body>
</html>

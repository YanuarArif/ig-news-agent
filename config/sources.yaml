# RSS Feed Sources and News API Sources
# Whitelist of trusted Indonesian news sources

rss_feeds:
  - name: "CNN Indonesia"
    url: "https://www.cnnindonesia.com/rss"
    category: "general"
    credibility_score: 8
    enabled: true

  - name: "CNN Indonesia Nasional"
    url: "https://www.cnnindonesia.com/nasional/rss"
    category: "general"
    credibility_score: 8
    enabled: true

  - name: "CNN Indonesia Teknologi"
    url: "https://www.cnnindonesia.com/teknologi/rss"
    category: "technology"
    credibility_score: 8
    enabled: true

  - name: "CNN Indonesia Hiburan"
    url: "https://www.cnnindonesia.com/hiburan/rss"
    category: "entertainment"
    credibility_score: 7
    enabled: true

  - name: "Antara News"
    url: "https://www.antaranews.com/rss/terkini.xml"
    category: "general"
    credibility_score: 9
    enabled: true

  - name: "Tempo Bisnis"
    url: "https://rss.tempo.co/bisnis"
    category: "business"
    credibility_score: 8
    enabled: true

  - name: "Tempo Tekno"
    url: "https://rss.tempo.co/tekno"
    category: "technology"
    credibility_score: 8
    enabled: true

  - name: "Tempo English"
    url: "https://rss.tempo.co/english"
    category: "general"
    credibility_score: 8
    enabled: true

news_api_sources:
  # Optional: NewsAPI.org or similar
  # Requires separate API key
  - name: "NewsAPI Indonesia"
    api_endpoint: "https://newsapi.org/v2/top-headlines"
    params:
      country: "id"
      category: "general"
    credibility_score: 8
    enabled: false  # Requires NEWS_API_KEY in .env

# Source filtering rules
source_filters:
  min_credibility_score: 6
  blocked_domains: []
  allowed_categories:
    - "general"
    - "business"
    - "technology"
    - "entertainment"
    - "sports"
    - "health"
  blocked_categories:
    - "politics"  # Requires manual review
    - "crime"     # Sensitivity check required
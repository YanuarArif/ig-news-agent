version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ig_news_agent
      POSTGRES_PASSWORD: ig_news_agent
      POSTGRES_DB: ig_news_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ig_news_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    environment:
      - DATABASE_URL=postgresql://ig_news_agent:ig_news_agent@postgres:5432/ig_news_agent
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./scripts:/app/scripts
      - ./mock_output:/app/mock_output
      - ./logs:/app/logs

volumes:
  postgres_data: